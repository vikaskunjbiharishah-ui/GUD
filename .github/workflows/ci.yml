name: Kosha CI

# Archived React/Tauri regression workflow. Run manually when needed; it
# must not consume Actions credits on every native-development commit.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Core tests
        run: npm test
      - name: Snapshot tests
        run: npm run test:snap
      - name: Database tests
        run: npm run test:db
